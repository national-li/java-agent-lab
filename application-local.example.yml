# ============================================================
# 模板文件（可以提交，只放占位符）
#
# 用法：
#   ① 复制成 src/main/resources/application-local.yml
#   ② 填上你的真实 key
#   ③ 激活 local profile：
#        IDEA:   Run Configuration → Active profiles 填 local
#        Maven:  .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=local
#
# ⚠️ application-local.yml 已被 .gitignore 排除，真实 key 放那里才安全
# ⚠️ 本文件带 .example 后缀，会被提交 —— 【绝对不能填真实 key】
#
# ------------------------------------------------------------
# 注意分工：
#   基础配置（数据库、Redis、超时重试、日志格式）在 application.yml
#   本文件只放【个人差异】，不要复制 application.yml 的内容过来
# ------------------------------------------------------------
# ============================================================

# ---------- 个人 API Key ----------
# 优先级：环境变量 DEEPSEEK_API_KEY  >  冒号后的默认值
#
# 推荐做法：key 只放环境变量，这里保持占位符不动
#   [Environment]::SetEnvironmentVariable("DEEPSEEK_API_KEY", "sk-xxx", "User")
llm:
  api-key: ${DEEPSEEK_API_KEY:在这里填你的key}

# ---------- 个人日志级别（本地调试用）----------
logging:
  level:
    com.example.agent: DEBUG

# ------------------------------------------------------------
# 其他可选的个人覆盖（需要时取消注释）
#
# spring:
#   datasource:
#     url: jdbc:postgresql://localhost:15432/agentdb   # 端口被占用换了映射
#   data:
#     redis:
#       password: 你自己的密码
#
